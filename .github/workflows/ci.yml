# Continuous integration: lint, types and the offline test suite.
# Only first party actions (actions/*) are used. The token can read the repository and nothing else.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install the development requirements
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install the development requirements
        run: pip install -r requirements-dev.txt
      - name: Types
        run: mypy lcsc2fusion

  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Let every combination finish, so one failing platform does not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install the development requirements
        run: pip install -r requirements-dev.txt
      # Node is preinstalled on the runners (the bridge and i18n tests drive it). No browser is
      # installed: the Playwright test skips itself when no Python on PATH has Playwright, and the
      # tests that need the Fusion API stubs skip too. -ra prints every skip reason.
      - name: Tests
        run: python -m pytest -ra
